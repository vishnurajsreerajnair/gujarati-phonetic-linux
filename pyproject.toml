[project]
name = "gujarati-phonetic-linux"
version = "1.0.0"
description = "Gujarati phonetic keyboard for Linux apps: Google's ChromeOS rules on IBus"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Vishnuraj", email = "vishnurajsreerajn@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff", "black", "python-xlib", "types-python-xlib"]

[project.scripts]
gujarati-phonetic-engine = "gujarati_phonetic.tools.cmd.engine:main"
gujarati-phonetic-check = "gujarati_phonetic.tools.cmd.check:main"
gujarati-phonetic-toggle = "gujarati_phonetic.tools.cmd.toggle:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gujarati_phonetic = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gujarati_phonetic.io.ibus_engine"]
disallow_subclassing_any = false
disallow_any_unimported = false
